[brief_weekly_audit]
description = Brief — weekly cross-app agent-readiness audit. Iterates installed apps under $SPLUNK_HOME/etc/apps/, runs the Brief pipeline against each, and writes per-app scores to the brief_scores index.
search = | briefaudit mode=live
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 0 3 * * 0
enableSched = 1
schedule_window = auto
display.general.type = statistics
display.page.search.tab = statistics
is_visible = 1

[brief_overall_readiness]
description = Brief — overall agent-readiness across all installed apps from the most recent audit run.
search = index=brief_scores earliest=-30d | stats latest(overall_score) as score by app_name | stats avg(score) as overall_readiness
enableSched = 0
is_visible = 0

[brief_worst_performers]
description = Brief — five lowest-scoring apps from the most recent audit run.
search = index=brief_scores earliest=-30d | stats latest(overall_score) as score, latest(presence_pct) as presence, latest(quality_avg) as quality, latest(safety_pct) as safety by app_name | sort score | head 5
enableSched = 0
is_visible = 0
