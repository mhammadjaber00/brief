[failed_login_count_24h]
description = Returns count of failed SSH login attempts in the last 24 hours, grouped by user and source IP. Use this for detecting credential stuffing patterns against the Linux fleet.
search = index=linux_secure sourcetype=linux_secure "Failed password" earliest=-24h@h \
    ``` Find every failed-password event in the last 24h ``` \
| stats count by user, src_ip \
| where count > 5
cron_schedule = 0 * * * *
enableSched = 1
dispatch.earliest_time = -24h@h
dispatch.latest_time = now

[stale_ioc_cleanup]
description = Removes indicators older than 30 days from the ioc_lookup table. Runs nightly at 02:30 UTC.
search = | inputlookup ioc_lookup \
| where last_seen < relative_time(now(), "-30d") \
| outputlookup ioc_lookup
cron_schedule = 30 2 * * *
enableSched = 1

[asset_dwell_time]
description = Joins the asset inventory against active sessions and reports average dwell time per asset over the last week. Used by IT operations for capacity planning.
search = index=assets \
| join asset_id [search index=sessions earliest=-7d] \
| stats avg(duration) as avg_duration by asset_id
enableSched = 0

[orphaned_processes]
search = index=endpoint sourcetype=sysmon EventCode=1 \
| stats count by Image, ParentImage \
| where count > 100
enableSched = 0

[all_traffic_baseline]
search = index=* earliest=-30d@d \
| stats count by sourcetype
enableSched = 0

[hourly_temp]
description = tmp
search = index=main | head 100
enableSched = 0
