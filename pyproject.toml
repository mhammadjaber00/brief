[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brief"
version = "0.1.0"
description = "Audit Splunk apps for AI-agent-readiness."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Brief contributors" }]
dependencies = [
    "splunk-sdk[ai]==3.0.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "structlog>=24.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "syrupy>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
brief = "brief.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brief"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
